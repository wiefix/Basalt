services:
  gitea:
    image: gitea/gitea:28.1.0-rootless@sha256:b1a90409ae9afcd5a5725404c3639da7245248848b99e35332968891290b953e
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: db:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: ${DB_PASSWORD}
      GITEA__server__DOMAIN: ${DOMAIN}
      GITEA__server__ROOT_URL: https://${DOMAIN}/
      GITEA__server__DISABLE_SSH: "true"
    volumes:
      - data:/var/lib/gitea
      - config:/etc/gitea
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "gitea", "-d", "gitea"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5m
      start_interval: 1s
volumes:
  data:
  config:
  pgdata:
